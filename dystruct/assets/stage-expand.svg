<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="830px" height="305px" viewBox="0 0 830 305" role="img"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="web-expand-1"><g><rect x="12" y="12" width="130" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242933" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="14" y="38.5">Prompt</text></g></g></g><g data-cell-id="web-expand-2"><g transform="translate(0.5,0.5)"><rect x="167" y="12" width="650" height="40" rx="6" ry="6" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="492" y="38">Summarize the water cycle in one sentence:</text></g></g></g><g data-cell-id="web-expand-3"><g><rect x="12" y="87" width="130" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242933" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="14" y="113.5">First window</text></g></g></g><g data-cell-id="web-expand-4"><g transform="translate(0.5,0.5)"><rect x="167" y="87" width="650" height="40" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="492" y="113">First [MASK] Window</text></g></g></g><g data-cell-id="web-expand-5"><g><rect x="12" y="162" width="130" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242933" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="14" y="188.5">Next window</text></g></g></g><g data-cell-id="web-expand-6"><g transform="translate(0.5,0.5)"><rect x="167" y="162" width="472" height="40" rx="6" ry="6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="403" y="188">Water evaporates into vapor, then condenses into clouds,</text></g></g></g><g data-cell-id="web-expand-7"><g transform="translate(0.5,0.5)"><rect x="647" y="162" width="170" height="40" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="732" y="188">Second [MASK] Window</text></g></g></g><g data-cell-id="web-expand-8"><g><rect x="12" y="237" width="130" height="54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#242933" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="14" y="270.5">Later window</text></g></g></g><g data-cell-id="web-expand-9"><g transform="translate(0.5,0.5)"><rect x="167" y="237" width="472" height="54" rx="8.1" ry="8.1" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="403" y="261.5">Water evaporates into vapor, then condenses into clouds,</text><text x="403" y="278.5">and falls back as precipitation</text></g></g></g><g data-cell-id="web-expand-10"><g transform="translate(0.5,0.5)"><rect x="647" y="237" width="170" height="54" rx="8.1" ry="8.1" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#242933" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(36, 41, 51), rgb(198, 202, 211));"><text x="732" y="270">Third [MASK] Window</text></g></g></g></g></g></g></svg>